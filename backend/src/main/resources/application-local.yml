# Local development profile using MySQL. Database credentials must be supplied
# through DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

solarmind:
  assumptions:
    generation-factor-kwh-per-kw-year: ${GENERATION_FACTOR_KWH_PER_KW_YEAR}
    installation-cost-per-kw: ${INSTALLATION_COST_PER_KW}
    grid-emission-factor: ${GRID_EMISSION_FACTOR}
    roof-layout-factor: ${ROOF_LAYOUT_FACTOR}
    roof-type-usable-factor:
      FLAT: ${ROOF_TYPE_USABLE_FACTOR_FLAT}
      SLOPED: ${ROOF_TYPE_USABLE_FACTOR_SLOPED}
      OTHER: ${ROOF_TYPE_USABLE_FACTOR_OTHER}
    system-lifespan-years: ${SYSTEM_LIFESPAN_YEARS:25}
    tariff-escalation-rate: ${TARIFF_ESCALATION_RATE:0.0}
    panel-degradation-rate: ${PANEL_DEGRADATION_RATE:0.0}
  ai:
    service-url: http://localhost:8000
    timeout: 5s
    internal-token: ${AI_INTERNAL_TOKEN}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  csv:
    import-enabled: true
    panels-path: ${PANELS_CSV_PATH}
    locations-path: ${LOCATIONS_CSV_PATH}
